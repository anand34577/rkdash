name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed by the release step; ignored on non-tag runs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs tags for the version stamp

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The package is Linux-only (/proc, /sys, unix.Statfs), so tests run
      # natively on the amd64 runner; vet runs against the real target arch.
      - run: go vet ./...
      - run: go test ./...
      - run: GOOS=linux GOARCH=arm64 go vet ./...

      # The installer runs as root on someone else's board; lint it like code.
      # Findings are re-emitted as workflow annotations so they appear on the
      # PR and in the checks API, rather than only inside the raw job log.
      - name: Lint install.sh
        run: |
          sh -n install.sh
          if ! shellcheck -f gcc -s sh install.sh > shellcheck.txt; then
            sed -E \
              -e 's/^([^:]+):([0-9]+):([0-9]+): note: (.*)$/::notice file=\1,line=\2,col=\3::\4/' \
              -e 's/^([^:]+):([0-9]+):([0-9]+): warning: (.*)$/::warning file=\1,line=\2,col=\3::\4/' \
              -e 's/^([^:]+):([0-9]+):([0-9]+): error: (.*)$/::error file=\1,line=\2,col=\3::\4/' \
              shellcheck.txt
            exit 1
          fi

      - name: Build linux/arm64
        run: |
          version="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || version="$(git describe --tags --always --dirty)"
          mkdir -p dist
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build \
            -trimpath -ldflags "-s -w -X main.appVersion=${version}" \
            -o dist/rkdash-linux-arm64 .
          cd dist && sha256sum rkdash-linux-arm64 > rkdash-linux-arm64.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: rkdash-linux-arm64
          path: dist/

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes

  # Actually run install.sh end to end on arm64 hardware — the download,
  # checksum and update paths can't be exercised on the amd64 build runner,
  # and a broken installer is invisible until someone tries it on a board.
  install-test:
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install from the published release
        run: sudo -E sh install.sh
        env:
          # On a tag run, verify the release this workflow just published;
          # otherwise smoke-test against whatever is currently latest.
          RKDASH_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Binary is installed and runnable
        run: |
          command -v rkdash
          rkdash --version

      - name: Re-running is a no-op update, not a failure
        run: sudo -E sh install.sh
        env:
          RKDASH_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Uninstall removes it
        run: |
          sudo sh install.sh --uninstall
          if command -v rkdash; then echo "still installed"; exit 1; fi
